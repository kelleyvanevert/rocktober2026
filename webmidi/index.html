<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webmidi livecode</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="stage"><canvas id="grid"></canvas></div>

    <aside id="sidebar" class="sidebar"></aside>

    <footer class="bar">
      <button id="play" title="Play / pause (space)">▶</button>
      <button id="clear" title="Remove all automatons and reset the frame counter">clear</button>
      <button id="panic" title="Stop every sounding note on every MIDI output">panic</button>
      <span class="frame">frame <span id="frame">0</span></span>
      <label>
        out
        <select id="output"><option>(requesting access…)</option></select>
      </label>
      <label>
        bpm
        <input id="bpm" type="number" min="40" max="300" value="120" />
      </label>
      <span id="status" class="status"></span>
      <span class="spacer"></span>
      <button id="zoom-out" title="Zoom out (⌘−)">−</button>
      <button id="zoom-in" title="Zoom in (⌘+)">+</button>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
